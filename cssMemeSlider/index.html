<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cssMemeSlider</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="slider-container">
        <h1>Прощай, трава!
            Серия из пяти работ, исследующих этику насилия.</h1>
        <input type="radio" name="meme-slider" id="slide1" class="slider-radio" checked>
        <input type="radio" name="meme-slider" id="slide2" class="slider-radio">
        <input type="radio" name="meme-slider" id="slide3" class="slider-radio">
        <input type="radio" name="meme-slider" id="slide4" class="slider-radio">
        <input type="radio" name="meme-slider" id="slide5" class="slider-radio">

        <div class="slider">
            <div class="slider-viewport">
                <div class="slider-track">
                    <div class="slide">
                        <img src="./images/1.jpeg" alt="slide1">
                    </div>
                    <div class="slide">
                        <img src="./images/2.jpeg" alt="slide2">
                    </div>
                    <div class="slide">
                        <img src="./images/3.jpeg" alt="slide3">
                    </div>
                    <div class="slide">
                        <img src="./images/4.jpeg" alt="slide4">
                    </div>
                    <div class="slide">
                        <img src="./images/5.jpeg" alt="slide5">
                    </div>
                </div>
            </div>
        </div>
        <div class="captions">
            <div class="captions-track">
                <div class="caption">Прощай, трава! (ИНИЦИАЦИЯ)</div>
                <div class="caption">Священная корова (АССИМИЛЯЦИЯ)</div>
                <div class="caption">Кровавый ритуал (ТРАНСФЕР)</div>
                <div class="caption">Человек-корнеплод (СИМБИОЗ)</div>
                <div class="caption">Прощай, трава! (ИНТЕГРАЦИЯ)</div>
            </div>
        </div>
        <div class="controls">
            <label for="slide1" class="control"></label>
            <label for="slide2" class="control"></label>
            <label for="slide3" class="control"></label>
            <label for="slide4" class="control"></label>
            <label for="slide5" class="control"></label>
        </div>
    </div>
</body>

</html>
